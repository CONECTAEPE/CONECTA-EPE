services:
  - type: web
    name: conecta-epe
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: conecta-epe-data
      mountPath: /var/data
      sizeGB: 1
